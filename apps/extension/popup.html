<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EntityManager Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>EntityManager Bridge</strong>
        <span>CAPTCHA token injector MVP</span>
      </header>

      <label>
        Bridge payload JSON
        <textarea id="payloadInput" rows="10" placeholder="Auto-fetch from EntityManager, or paste Bridge Payload JSON for fallback"></textarea>
      </label>

      <label>
        Desktop fetch URL
        <input id="fetchUrlInput" placeholder="http://127.0.0.1:17321/captcha/injection/next" />
      </label>

      <label>
        Desktop callback URL
        <input id="callbackUrlInput" placeholder="http://127.0.0.1:17321/captcha/injection/complete" />
      </label>

      <label>
        Submit/verify fetch URL
        <input id="submitFetchUrlInput" placeholder="http://127.0.0.1:17321/account/submit-verify/next" />
      </label>

      <label>
        Submit/verify callback URL
        <input id="submitCallbackUrlInput" placeholder="http://127.0.0.1:17321/account/submit-verify/complete" />
      </label>

      <div class="actions">
        <button id="fetchPayloadButton" type="button">Fetch Next Payload</button>
        <button id="savePayloadButton" type="button">Save Payload</button>
        <button id="injectButton" type="button">Inject Active Tab</button>
        <button id="dryRunButton" type="button">Dry-run Preview</button>
        <button id="submitVerifyButton" type="button">Submit/Verify Tab</button>
      </div>

      <pre id="statusOutput">Ready.</pre>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
