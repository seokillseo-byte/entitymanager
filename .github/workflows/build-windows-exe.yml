name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  APP_VERSION: 0.1.0

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Selector health unit tests
        run: pnpm test:selector-health

      - name: Build Chrome extension package
        run: pnpm extension:build

      - name: Zip Chrome extension
        shell: pwsh
        run: Compress-Archive -Path apps/extension/dist/* -DestinationPath EntityManager-Chrome-Extension.zip -Force

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: EntityManager-Chrome-Extension
          path: EntityManager-Chrome-Extension.zip
          if-no-files-found: error

      - name: Typecheck
        run: pnpm typecheck

      - name: Ensure Windows icon exists
        shell: pwsh
        run: ./scripts/ensure-tauri-icon.ps1

      - name: Build Windows installer
        shell: pwsh
        run: pnpm desktop:build 2>&1 | Tee-Object tauri-build.log

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EntityManager-Windows-Installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: EntityManager Desktop v${{ env.APP_VERSION }} build ${{ github.run_number }}
          body: |
            Automated Windows desktop build for EntityManager.

            Download the NSIS installer asset and run it on Windows.
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            EntityManager-Chrome-Extension.zip

      - name: Upload Tauri build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: ignore
